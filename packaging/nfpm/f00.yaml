# nfpm template for f00 ASM suite.
# Placeholders: VERSION, ARCH (amd64), BIN_PATH, MAN_DIR, LINKS_DIR,
#               SUPERSEDE_DIR, PATH_SH, PROFILE_SH, ZSHENV, PROFILE_FISH
name: f00
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: William Theesfeld <william@theesfeld.net>
description: |
  f00tils (f00) replaces GNU coreutils + grep + findutils + diffutils (115 tools).
  One freestanding x86-64 assembly multicall binary (no libc).
  Default: bare names (ls/cat/grep/find/diff/…) via /usr/lib/f00/bin on PATH.
  PATH is enabled for every zsh (/etc/zsh/zshenv) and login shells (profile.d).
  Toggle: replace = false in ~/.config/f00/config, or f00-config replace off.
  --core / F00_CORE=1 for script-safe GNU-identical presentation.
homepage: https://f00.sh
license: MIT
contents:
  - src: ${BIN_PATH}
    dst: /usr/bin/f00
    file_info:
      mode: 0755
  - src: ${LINKS_DIR}/
    dst: /usr/bin/
    type: tree
    file_info:
      mode: 0755
  # Bare names — not in /usr/bin (avoids package file conflicts with GNU).
  - src: ${SUPERSEDE_DIR}/
    dst: /usr/lib/f00/bin/
    type: tree
    file_info:
      mode: 0755
  - src: ${PATH_SH}
    dst: /usr/lib/f00/shell/path.sh
    file_info:
      mode: 0644
  - src: ${PROFILE_SH}
    dst: /etc/profile.d/f00.sh
    file_info:
      mode: 0644
  # Critical on Arch: non-login zsh (default terminal) never loads profile.d
  - src: ${ZSHENV}
    dst: /etc/zsh/zshenv
    file_info:
      mode: 0644
  - src: ${PROFILE_FISH}
    dst: /etc/fish/conf.d/f00.fish
    file_info:
      mode: 0644
  - src: ${MAN_DIR}/
    dst: /usr/share/man/man1/
    type: tree
    file_info:
      mode: 0644
overrides:
  deb:
    depends: []
  rpm:
    depends: []
