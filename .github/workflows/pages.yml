name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: pages-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Seed releases/current (latest channel)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/releases/current
          tag=$(gh api repos/f00-sh/f00tils/releases/latest --jq .tag_name)
          ver=${tag#v}
          asset="f00-${ver}-linux-x86_64.tar.gz"
          cd site/releases/current
          if ! gh release download "$tag" -R f00-sh/f00tils -p "$asset" -p SHA256SUMS; then
            asset="f00-${ver}-x86_64-linux.tar.gz"
            gh release download "$tag" -R f00-sh/f00tils -p "$asset" -p SHA256SUMS || true
          fi
          ln -sfn "$asset" f00-linux-x86_64.tar.gz
          printf '%s\n' "$ver" > VERSION
          python3 - <<PY
          import json
          from pathlib import Path
          ver = Path("VERSION").read_text().strip()
          Path("manifest.json").write_text(
              json.dumps(
                  {
                      "product": "f00tils",
                      "version": ver,
                      "tag": f"v{ver}",
                      "channel": "current",
                      "assets": {
                          "linux-x86_64": {
                              "file": "f00-linux-x86_64.tar.gz",
                              "url": "https://coreutils.f00.sh/releases/current/f00-linux-x86_64.tar.gz",
                          }
                      },
                      "github_repo": "f00-sh/f00tils",
                  },
                  indent=2,
              )
              + "\n"
          )
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=f00-coreutils --branch=main
