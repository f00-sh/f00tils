name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: pages-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Seed releases/current metadata from R2
        run: |
          set -euo pipefail
          mkdir -p site/releases/current
          dist="https://dist.f00.sh/f00tils/current"
          # Prefer live R2 current; fall back to git tag only if edge is empty
          ver=$(curl -fsSL "$dist/VERSION" | tr -d '[:space:]' || true)
          if [[ -z "$ver" ]]; then
            ver=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          fi
          [[ -n "$ver" ]] || { echo "could not resolve VERSION from R2 or git" >&2; exit 1; }
          printf '%s\n' "$ver" > site/releases/current/VERSION
          python3 - <<PY
          import json
          from pathlib import Path
          ver = Path("site/releases/current/VERSION").read_text().strip().lstrip("v")
          dist = "https://dist.f00.sh/f00tils/current"
          Path("site/releases/current/manifest.json").write_text(
              json.dumps(
                  {
                      "product": "f00tils",
                      "binary": "f00",
                      "version": ver,
                      "tag": f"v{ver}",
                      "channel": "current",
                      "download_base": dist,
                      "assets": {
                          "linux-x86_64": {
                              "file": "f00-linux-x86_64.tar.gz",
                              "url": f"{dist}/f00-linux-x86_64.tar.gz",
                          }
                      },
                      "github_repo": "f00-sh/f00tils",
                  },
                  indent=2,
              )
              + "\n"
          )
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=f00-coreutils --branch=main
